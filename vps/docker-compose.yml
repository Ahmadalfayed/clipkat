# كليب كات — Docker Compose: قاعدة بيانات PostgreSQL + التطبيق (Node.js) + Caddy (HTTPS تلقائي)
# كل الإعدادات من ملف .env (ينشئه install.sh). لا تعدّل هذا الملف إلا إن كنت تعرف ما تفعل.
name: clipkat

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipkat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing - run install.sh}
      POSTGRES_DB: clipkat
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # يُطبَّق تلقائياً عند أول تشغيل
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipkat -d clipkat"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]            # لا منافذ مكشوفة للعالم

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://clipkat:${DB_PASSWORD}@db:5432/clipkat
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing - run install.sh}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-500}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TRANSCODE: ${TRANSCODE:-1}
      TRANSCODE_PRESET: ${TRANSCODE_PRESET:-veryfast}
      TRANSCODE_CRF: ${TRANSCODE_CRF:-23}
      TRANSCODE_THREADS: ${TRANSCODE_THREADS:-2}
      # البث المباشر والمكالمات (فارغة = الميزتان معطّلتان)
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_URL: http://host.docker.internal:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # العملات وهدايا البث — PAYMENT_PROVIDER=demo (افتراضي) لا يخصم أي مبلغ حقيقي
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-demo}
      GIFT_PLATFORM_SHARE: ${GIFT_PLATFORM_SHARE:-50}
      DIAMOND_VALUE_KWD: ${DIAMOND_VALUE_KWD:-0.0025}
      PAYOUT_MIN_DIAMONDS: ${PAYOUT_MIN_DIAMONDS:-2000}
      DEMO_COINS_DAILY_MAX: ${DEMO_COINS_DAILY_MAX:-20000}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MYFATOORAH_API_KEY: ${MYFATOORAH_API_KEY:-}
      MYFATOORAH_BASE_URL: ${MYFATOORAH_BASE_URL:-}
      TAP_SECRET_KEY: ${TAP_SECRET_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./data/uploads:/data/uploads
    networks: [internal]
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      MAX_BODY: ${MAX_BODY:-520MB}
    extra_hosts: ["host.docker.internal:host-gateway"]   # للوصول إلى LiveKit (شبكة المضيف)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    networks: [internal]

  # خادم الوسائط للبث المباشر والمكالمات (SFU + TURN مدمج). شبكة المضيف لتفادي NAT على منافذ UDP.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    profiles: ["live"]              # يُشغَّل فقط عند: COMPOSE_PROFILES=live في .env
    network_mode: host
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
      - ./data/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory:/certs:ro

networks:
  internal:
