apply plugin: 'com.android.application'

// توقيع الإصدار: يُقرأ من ملف خارج المستودع (لا تُرفع كلمات السر أبداً).
// Override path with env CLIPKAT_SIGNING_PROPS.
def signingPropsFile = file(System.getenv('CLIPKAT_SIGNING_PROPS') ?: '/workspace/clipkat-signing/keystore.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) { signingPropsFile.withInputStream { signingProps.load(it) } }

android {
    namespace = "live.clipkat.app"
    compileSdk = 36
    defaultConfig {
        applicationId "live.clipkat.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        resourceConfigurations += ["ar", "en"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (signingProps['storeFile']) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingProps['storeFile']) { signingConfig signingConfigs.release }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    testImplementation 'junit:junit:4.13.2'
}
