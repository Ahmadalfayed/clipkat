<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>كليب كات</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: #0b1020;
      color: #eef2ff;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Naskh Arabic', 'Noto Sans Arabic', Tahoma, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; }
    .mark { width: 88px; height: 88px; margin: 0 auto 20px; filter: drop-shadow(0 8px 18px rgba(18,194,160,.28)); }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #12c2a0 0%, #5fd08a 45%, #f5a524 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 0 0 10px; color: #97a1c0; line-height: 1.7; font-size: 16px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      min-width: 200px;
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #12c2a0 0%, #5fd08a 45%, #f5a524 100%);
      color: #04221c;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }
    footer { margin-top: 36px; color: #5d6580; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12c2a0"/><stop offset="1" stop-color="#f5a524"/></linearGradient></defs>
      <path d="M12 22 L14 6 L26 16 Q32 14.5 38 16 L50 6 L52 22 Q56 28 56 36 Q56 58 32 58 Q8 58 8 36 Q8 28 12 22Z" fill="url(#g)"/>
      <path d="M27 27 L42 36 L27 45Z" fill="#0b1020" stroke="#0b1020" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <h1>كليب كات</h1>
    <p>لا يوجد اتصال بالإنترنت</p>
    <p>تأكد من الشبكة ثم أعد المحاولة.</p>
    <a class="btn" href="https://clipkat.live/">إعادة المحاولة</a>
    <footer>جميع الحقوق محفوظة © 2026 وطن النهار</footer>
  </main>
</body>
</html>
